<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestionnaire de dépenses</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>💰 Gestionnaire de dépenses</h1>
    <p>Notez vos dépenses, suivez votre budget mensuel.</p>
  </header>

  <main>
    <section class="card summary">
      <div><span>Total affiché</span><strong id="total">0 DH</strong></div>
      <div>
        <label for="budget">Budget mensuel (DH)</label>
        <input type="number" id="budget" min="0" placeholder="ex : 3000">
      </div>
      <p id="budget-alert" class="alert" hidden></p>
    </section>

    <section class="card">
      <h2>Ajouter une dépense</h2>
      <form id="expense-form">
        <input type="text" id="title" placeholder="Titre (ex : Courses)" required>
        <input type="number" id="amount" placeholder="Montant (DH)" step="0.01" required>
        <select id="category"></select>
        <input type="date" id="date" required>
        <button type="submit">Ajouter</button>
      </form>
      <p id="form-error" class="error" role="alert"></p>
    </section>

    <section class="card">
      <h2>Mes dépenses</h2>
      <div class="filters">
        <select id="filter-category"><option value="">Toutes les catégories</option></select>
        <input type="month" id="filter-month">
        <button id="export-btn" type="button">Exporter en CSV</button>
        <button id="clear-btn" type="button">Tout effacer</button>
      </div>
      <table>
        <thead><tr><th>Date</th><th>Titre</th><th>Catégorie</th><th>Montant</th><th></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
      <p id="empty" hidden>Aucune dépense à afficher.</p>
    </section>

    <section class="card">
      <h2>Répartition par catégorie</h2>
      <div class="chart-box"><canvas id="chart"></canvas></div>
    </section>
  </main>

  <script src="logic.js"></script>
  <script src="script.js"></script>
</body>
</html>
